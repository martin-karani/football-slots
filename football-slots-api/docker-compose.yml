services:
  postgres:
    image: postgres:16-alpine
    container_name: football-slots-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_slots
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_slots"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local email/SMS capture for development.
  # Start with: docker compose --profile dev up -d
  # Web UI: http://localhost:8000
  buggregator:
    image: ghcr.io/buggregator/server:latest
    container_name: football-slots-buggregator
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8000:8000" # Web UI + SMS capture (POST /sms)
      - "1026:1025" # Fake SMTP server (email capture)
    volumes:
      - ./buggregator.yaml:/buggregator.yaml
    environment:
      CLIENT_SUPPORTED_EVENTS: "smtp,sms,http-dump"

volumes:
  postgres_data:
