services:
  postgres:
    image: postgres:16-alpine
    container_name: football-slots-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_slots
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_slots"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
